name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on the same ref (e.g. a second push to a PR)
  # instead of letting both finish. Scoped to pull_request only: two
  # `push: main` runs share a ref too, and cancelling the first would
  # leave a commit on main with no completed check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ts: ${{ steps.filter.outputs.ts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            ts:
              - 'package.json'
              - 'package-lock.json'
              - 'ui/**'
              - 'web/**'
              - 'eslint.config.js'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.gitignore'
              - '.nvmrc'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  # Go suite: skipped entirely when a change only touches ui/ or web/.
  go:
    name: go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: golangci-lint-goinstall-v1.64.8-${{ runner.os }}
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - run: make check-go

  # TypeScript gate: skipped entirely when a change is Go-only.
  ts:
    name: ts
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check-ts

  # Release build: always runs, regardless of what changed. This is the one
  # place Go and TypeScript are required to work together, so it is never
  # path-filtered — that's what keeps the filters above honest.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make build
      - run: make build-ts

  # Fan-in gate: succeeds only if none of the jobs above failed or were
  # cancelled. `if: always()` makes it run even when a path-filtered job is
  # skipped, so this — not `go`/`ts`/`build` individually — is what branch
  # protection should require. Without it, a required-but-skipped job (e.g.
  # `ts` on a Go-only PR) would block merging forever.
  ci:
    name: ci
    needs: [changes, go, ts, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "one or more required jobs failed"
            exit 1
          fi
